<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ChemHub 化学工具导航 — 发现结构绘制、化合物数据库、合成、光谱及文献检索工具。">
  <meta name="theme-color" content="#10141d">
  <title>ChemHub — 化学工具导航</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5604621379037055" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="design.css">
  <script src="tools.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M8 15h8"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 5h.01M3 12h.01M3 19h.01"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-web" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 9V3h6v6l3 3v3H6v-3ZM12 15v7"/></symbol>
  </svg>
  <a href="#main" class="skip-link">跳到工具目录</a>
  <header class="header">
    <nav class="dock" aria-label="主导航">
      <a class="brand" href="index.html" aria-label="ChemHub 首页" title="ChemHub 化学工具导航"><span class="brand-icon"><svg><use href="#i-flask"/></svg></span><span>ChemHub</span></a>
      <span class="dock-divider" aria-hidden="true"></span>
      <button id="browse" class="nav-button selected" aria-label="浏览全部工具"><svg><use href="#i-grid"/></svg><span>浏览</span></button>
      <button id="filterToggle" class="nav-button" aria-expanded="false" aria-controls="searchPanel"><svg><use href="#i-compass"/></svg><span>分类</span></button>
      <span class="dock-divider" aria-hidden="true"></span>
      <button id="searchToggle" class="icon-button" aria-label="搜索工具（Ctrl 或 Command K）" title="搜索工具 · Ctrl / ⌘ K" aria-expanded="false" aria-controls="searchPanel"><svg><use href="#i-search"/></svg></button>
      <button id="viewToggle" class="icon-button" aria-label="切换为列表视图" title="切换为列表视图" aria-pressed="false"><svg><use href="#i-list"/></svg></button>
    </nav>
    <section id="searchPanel" class="search-panel" aria-label="搜索与分类" hidden>
      <div class="search-field"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" aria-label="搜索化学工具" placeholder="搜索工具名称、用途或关键词…" autocomplete="off"><button id="closePanel" class="icon-button" aria-label="收起搜索与分类"><svg><use href="#i-close"/></svg></button></div>
      <div id="filters" class="filters" role="group" aria-label="工具分类"></div>
      <div class="panel-foot"><span>找到适合你的研究工具</span><span><kbd>Esc</kbd> 收起</span></div>
    </section>
  </header>
  <div class="page-layout">
    <main id="main" tabindex="-1">
      <h1 class="sr-only">ChemHub 化学工具目录</h1>
      <section id="pinnedTools" class="pinned-tools" aria-labelledby="pinnedTitle" hidden>
        <div class="pinned-header">
          <div class="pinned-label"><h2 id="pinnedTitle"><svg aria-hidden="true"><use href="#i-pin"/></svg>置顶工具</h2><span id="pinnedCount" class="pinned-count">0 个</span></div>
          <button id="choosePinned" class="pin-choose" type="button" aria-label="搜索并置顶工具"><svg aria-hidden="true"><use href="#i-search"/></svg>选择工具</button>
        </div>
        <p class="pinned-note">仅保存在当前浏览器，不会同步到其他设备。</p>
        <p id="pinnedEmpty" class="pinned-empty">点击卡片右上角的图钉，把常用工具放到这里。</p>
        <div id="pinnedGrid" class="pinned-grid"></div>
      </section>
      <p id="pinNotice" class="pin-notice" role="status" hidden>浏览器存储不可用，置顶更改仅在当前页面生效。</p>
      <div id="results" class="results" hidden><span id="resultText" role="status"></span><button id="reset">清除筛选 <span aria-hidden="true">×</span></button></div>
      <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
      <div id="toolGrid" class="tool-grid" tabindex="-1"></div>
      <noscript><p class="empty">请启用 JavaScript 以浏览和搜索化学工具。</p></noscript>
      <footer><a href="index.html">ChemHub <span>· 化学工具导航</span></a><span id="total"></span><span>外部网站的内容与服务由各自提供方负责</span></footer>
    </main>
  </div>
</body>
</html>
